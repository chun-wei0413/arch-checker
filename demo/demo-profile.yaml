name: demo-profile

# Style Profile for the OOAD midterm demo.
# A small payment-processing app split into three layers
# (controller / service / domain). One violation per rule, each one
# echoing a common code-review concern — not a contrived typo.
rules:

  # ───────────────────────────────────────────────────────────
  # R-NAME-01 · NamingRule
  #   Avoid the catch-all suffixes Manager / Helper / Util / Handler;
  #   pick a role-specific suffix instead (Service, Reconciler, …).
  #
  #   Triggered by:  service/PaymentManager.java
  # ───────────────────────────────────────────────────────────
  - type: naming
    id: R-NAME-01
    description: Avoid the vague suffixes Manager / Helper / Util / Handler
    classNamePattern: '(?!.*(?:Manager|Helper|Util|Handler)$).*'

  # ───────────────────────────────────────────────────────────
  # R-DEP-01 · DependencyRule
  #   The service layer must not depend on the controller layer.
  #   Standard top-down layering: Controller → Service → Domain.
  #
  #   Triggered by:  service/ChargeService.java imports PaymentController
  # ───────────────────────────────────────────────────────────
  - type: dependency
    id: R-DEP-01
    description: Service layer must not depend on the controller layer
    sourcePackage: com.example.service
    targetPackage: com.example.controller
    isAllowed: false

  # ───────────────────────────────────────────────────────────
  # R-SUP-01 · SupertypeRule
  #   Every concrete payment in com.example.domain.payment must extend
  #   the abstract Payment base type so the rest of the system can
  #   treat them polymorphically (List<Payment>, single charge() entry
  #   point, etc.).
  #
  #   Triggered by:  domain/payment/CashPayment.java does not extend Payment
  # ───────────────────────────────────────────────────────────
  - type: supertype
    id: R-SUP-01
    description: Concrete payments in com.example.domain.payment must extend Payment
    targetPackage: com.example.domain.payment
    requiredSupertype: Payment

  # ───────────────────────────────────────────────────────────
  # R-PKG-01 · PackageRule
  #   A typical layered project should have a com.example.repository
  #   package collecting the persistence interfaces. The sample-project
  #   deliberately omits it.
  #
  #   Triggered:  project-level (line 0).
  # ───────────────────────────────────────────────────────────
  - type: package
    id: R-PKG-01
    description: Project should contain a com.example.repository package
    packagePattern: com.example.repository

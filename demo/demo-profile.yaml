name: demo-profile

# Style Profile for the OOAD midterm demo.
# Three architectural rules; arch-checker validates the sample-project against them.
rules:

  # NamingRule — every class in the project must end with "Service".
  # UserManager.java intentionally violates this rule for the demo.
  - type: naming
    id: R-NAME-01
    description: Class names must end with the 'Service' suffix
    classNamePattern: '\w+Service'

  # PackageRule — the project must contain at least one class under com.example.service.
  - type: package
    id: R-PKG-01
    description: Project must contain a com.example.service package
    packagePattern: com.example.service

  # DependencyRule — the service package must not depend on any controller package.
  # No violation in the sample-project; serves as a baseline rule that always passes.
  - type: dependency
    id: R-DEP-01
    description: Service layer must not depend on controllers
    sourcePackage: com.example.service
    targetPackage: com.example.controller
    isAllowed: false

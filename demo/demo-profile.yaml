name: demo-profile

# Style Profile for the OOAD midterm demo.
# A small three-layer Java app (service / controller / support), with
# one violation per rule. Each violation reflects a common code-review
# concern — not a contrived typo.
rules:

  # ───────────────────────────────────────────────────────────
  # R-NAME-01 · NamingRule
  #   Avoid the catch-all suffixes Manager / Helper / Util / Handler;
  #   pick a role-specific suffix instead (Service, Reservation, …).
  #
  #   Triggered by:  service/InventoryManager.java
  # ───────────────────────────────────────────────────────────
  - type: naming
    id: R-NAME-01
    description: Avoid the vague suffixes Manager / Helper / Util / Handler
    classNamePattern: '(?!.*(?:Manager|Helper|Util|Handler)$).*'

  # ───────────────────────────────────────────────────────────
  # R-DEP-01 · DependencyRule
  #   The service layer must not depend on the controller layer.
  #   Standard top-down layering: Controller → Service → (Repository).
  #
  #   Triggered by:  service/AuditService.java imports HomeController
  # ───────────────────────────────────────────────────────────
  - type: dependency
    id: R-DEP-01
    description: Service layer must not depend on the controller layer
    sourcePackage: com.example.service
    targetPackage: com.example.controller
    isAllowed: false

  # ───────────────────────────────────────────────────────────
  # R-SUP-01 · SupertypeRule
  #   Every type in com.example.controller must extend BaseController
  #   so it inherits common error handling / logging / auth middleware.
  #
  #   Triggered by:  controller/CartController.java (does not extend)
  # ───────────────────────────────────────────────────────────
  - type: supertype
    id: R-SUP-01
    description: Classes in com.example.controller must extend BaseController
    targetPackage: com.example.controller
    requiredSupertype: BaseController

  # ───────────────────────────────────────────────────────────
  # R-PKG-01 · PackageRule
  #   A typical web app should have a com.example.entity package for
  #   data models. The sample-project deliberately omits it.
  #
  #   Triggered:  project-level (line 0).
  # ───────────────────────────────────────────────────────────
  - type: package
    id: R-PKG-01
    description: Project should contain a com.example.entity package
    packagePattern: com.example.entity
